spring:
  application:
    name: know-your-interview-api

  datasource:
    # Local-dev defaults below. Override with DB_URL/DB_USERNAME/DB_PASSWORD env vars for
    # any shared/deployed environment — same pattern as JWT_SECRET further down.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kyi}
    username: ${DB_USERNAME:kyi}
    password: ${DB_PASSWORD:kyi_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      # A single connection URL (redis://[:password@]host:port[/db]) covers host, port,
      # and auth in one property — matches what most hosted Redis add-ons (Railway
      # included) hand you as a single REDIS_URL env var, so no separate host/port/
      # password wiring is needed.
      url: ${REDIS_URL:redis://localhost:6379}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Transactional email over SMTP — works with Postmark, SendGrid, Resend, Mailgun or any
  # other provider, so switching vendors is these values and nothing else.
  #
  # Leave MAIL_HOST unset (the default) and Spring Boot creates no JavaMailSender at all,
  # which EmailConfig detects and falls back to logging the message instead of sending it.
  # That's the local-dev path: confirmation and password-reset links appear in the console.
  #
  # To actually send: set MAIL_HOST/MAIL_USERNAME/MAIL_PASSWORD (and MAIL_FROM_ADDRESS under
  # app.email below) to your provider's SMTP credentials. Port 587 with STARTTLS is the
  # near-universal default; 465 with implicit TLS also exists if a provider prefers it.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            # Fail rather than silently falling back to an unencrypted connection if the
            # server doesn't offer STARTTLS — these messages carry account-recovery links.
            required: true
        # Don't let a hung mail server hold a request thread open indefinitely. Sending is
        # synchronous within the registration/forgot-password call, so these bound the worst
        # case a user can experience.
        smtp.connectiontimeout: 5000
        smtp.timeout: 5000
        smtp.writetimeout: 5000

server:
  port: 8080

logging:
  level:
    com.knowyourinterview: INFO

management:
  endpoints:
    web:
      # Only health + info reachable over HTTP — nothing else (env, beans, threaddump,
      # etc.) is exposed, so SecurityConfig only needs one permitAll rule for this.
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      # "ADMIN" here matches the ROLE_ADMIN granted authority JwtAuthenticationFilter
      # already sets for admin users — same role used by SecurityConfig's
      # hasRole("ADMIN") rules elsewhere. Non-admins (and the unauthenticated
      # liveness/readiness probes below) just get {"status":"UP"}, no component detail.
      roles: ADMIN
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  # Where the web app is served from — used to build user-facing links that live in the
  # frontend's routes, currently just the password-reset link (AuthService#forgotPassword).
  # Defaults to the Vite dev server; set WEB_BASE_URL to the deployed web origin in any
  # other environment, or reset links will point people at their own localhost.
  web-base-url: ${WEB_BASE_URL:http://localhost:5173}
  jwt:
    # Local-dev-only default. Override with the JWT_SECRET env var for any shared/deployed environment —
    # HMAC-SHA256 needs >= 256 bits; this is a placeholder, not a real secret.
    secret: ${JWT_SECRET:dev-only-change-me-0123456789abcdef0123456789abcdef}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  password-reset:
    token-ttl-minutes: 60
  email-verification:
    # Generous compared to the password-reset window above, on purpose: a reset is something
    # you asked for and are waiting on, while a confirmation email competes with everything
    # else in an inbox. Expiring it in an hour would mostly generate resends.
    token-ttl-hours: 24
  email:
    # The From: on transactional mail. Must be an address at a domain the SMTP provider has
    # verified for sending, or messages will be rejected or land in spam regardless of the
    # rest of the configuration being right.
    from-address: ${MAIL_FROM_ADDRESS:no-reply@knowyourinterview.local}
    from-name: ${MAIL_FROM_NAME:Know Your Interview}
  storage:
    # Local-disk proof storage for dev. Swap for an S3-backed implementation of
    # ProofStorageService in Phase 6 without touching callers.
    proof-dir: ${PROOF_STORAGE_DIR:./uploads/proof}
  pagination:
    # Upper bound on the page size a Browse request can ask for — clamps a caller passing
    # ?size=5000 down to something sane. Wired into ExperienceService.browsePublished.
    max-page-size: 100
  rate-limit:
    # Does a trusted proxy sit in front of this app and set X-Forwarded-For? Off by default,
    # which is right for local dev and for anything directly internet-facing (the header is
    # attacker-controlled there, so trusting it would defeat the limiter entirely).
    #
    # Set TRUST_FORWARDED_FOR=true in any deployment behind a load balancer/CDN — Railway
    # included. Without it, every request looks like it comes from the proxy's single IP, so
    # the per-IP limits in RateLimitingFilter become global: 10 logins/minute shared across
    # the entire user base rather than per person.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
  pricing:
    # Platform-fixed viewer unlock price (paise), applied to every experience at
    # creation time — contributors don't set their own price. Tiering by company/role
    # is a later feature.
    default-price-paise: 9900
    # Flat one-time contributor payout (paise) on publish — separate from the viewer
    # price above; per the Phase 0 design these are two independent platform-set amounts.
    contributor-payout-paise: 50000
  razorpay:
    # No safe local-dev default for real payment credentials — set these as env vars,
    # never commit actual values. Test Mode keys from dashboard.razorpay.com are fine
    # to use locally; they don't move real money.
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  google:
    # Blank = "Sign in with Google" is disabled (POST /api/v1/auth/google returns 503) —
    # same graceful-degradation pattern as Razorpay above. Set to the Web application OAuth
    # Client ID from Google Cloud Console (ends in .apps.googleusercontent.com). See
    # docs/06-deployment.md for how to create one.
    client-id: ${GOOGLE_CLIENT_ID:}
  admin-bootstrap:
    # Blank = POST /api/v1/auth/bootstrap-admin is disabled (returns 503) — same
    # graceful-degradation pattern as above. Set to a long random value to promote a
    # registered account to admin without direct database access: register normally, then
    # POST {email, secret} to bootstrap-admin. Treat this like any other credential — don't
    # commit a real value, and consider unsetting it again once you have your first admin.
    secret: ${ADMIN_BOOTSTRAP_SECRET:}

# Error tracking (sentry.io). Blank DSN = the Sentry Spring Boot starter quietly
# no-ops (no crashes, no events sent) — same pattern as the Razorpay keys above. Create
# a free Sentry project and set SENTRY_DSN when you're ready to use this.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  # Performance tracing is separate from error reporting and samples/costs differently —
  # off by default. Set SENTRY_TRACES_SAMPLE_RATE (0.0-1.0) once you want it.
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
