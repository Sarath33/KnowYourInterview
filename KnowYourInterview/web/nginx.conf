server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — the client-side History-API router (web/src/lib/router.tsx) owns
    # every path (e.g. /library, /submissions), so any path not matching a real static
    # asset should still serve index.html and let the router take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite — safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
